schema: spec-driven

# Project context — Aletheia Reader (griego ἀλήθεια; legacy "alethia" solo en fallback storage/SW y repo externo alethia-gateway)
context: |
  Tech stack: Next.js 16.3 + React 19.2 + TypeScript 5.9 + Tailwind CSS v4 + Bun 1.3 como package manager.
  No usar npm/npx/yarn. Comandos: bun install, bun dev, bun run build, bun run lint.
  Estructura: app/ (layout, page orquestador, globals.css, manifest), components/reader/ (ComfortBibleReader god-container, ReadingCanvas paginación DOM, ReaderToolbar, ReaderFooter, LineFocusOverlay, PaperGrainOverlay, PwmDimmerOverlay, VerseModal, VersionSelector), lib/ (bible-service adapter gateway dict→array, storage-service claves aletheia_* con fallback alethia_*, tts-service EasySpeech+nativo, piper-service WASM es_ES, text-transforms biónica/sílabas, wake-lock), types/bible.ts (fuente verdad TranslationId 9 versiones), public/data/bibles/{9 versiones}/ + sw.js (CACHE aletheia-v1, limpia alethia-*), scripts/copy-piper-assets.mjs.
  Convenciones: Conventional Commits, WCAG 2.2 objetivo AAA (real hoy: AA cumplido, AAA parcial — ver auditoría 2026-09-04), max-w 60ch, text-left nunca justify, targets táctiles objetivo 44px (real hoy 36-40px en ui/button), focus-visible 3px.
  Dominio: lector bíblico confort neurocognitivo (E-Ink emulation, PWM dimmer GPU 0.3-1.0, Line Focus 1/3/5, tipografías Literata/Atkinson/OpenDyslexic — Bookerly solo fallback sin archivo).
  Restricciones: sin infinite scroll (paginación discreta), sin blanco #FFF ni negro #000 puros en UI lector (excepciones conocidas: accent-fg #FFF, PwmDimmer #000 — pendientes), canvas de lectura sin animaciones (paginación instantánea; solo chrome UI con CSS ≤150ms, anulable por prefers-reduced-motion), sin librerías de animación.

rules:
  proposal:
    - Incluir Why / What (MVP) / Non-Goals / Impact con archivos y líneas
    - Todo claim de accesibilidad o contraste debe citar medición o marcarse PARCIAL/NO CUMPLE
    - Si toca claves storage, caché SW o nombre de marca, exigir plan de migración
  tasks:
    - Checkboxes pequeños, verificables con bun run build + tsc --noEmit cuando exista
    - Marcar [x] solo con evidencia en código, no por intención
  specs:
    - Cada Requirement ADDED/MODIFIED necesita al menos un #### Scenario: WHEN/THEN

operations:
  apply:
    guidance:
      - Avanzar de a poco, un change por vez, sin refactors oportunistas
      - Tras cada cambio correr bun run build y bunx tsc --noEmit
  archive:
    guidance:
      - Solo archivar con tasks 100% [x] y validate sin errores
